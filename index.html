<style>
:root{--bg:#0d1117;--panel:#161b22;--fg:#c9d1d9;--dim:#8b949e;--green:#39d353;--blue:#58a6ff;--yellow:#e3b341;--red:#f85149;--purple:#bc8cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.6 "JetBrains Mono",ui-monospace,Consolas,monospace}
.win{width:100%;height:100vh;height:100dvh;margin:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.bar{background:var(--panel);padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #30363d;color:var(--dim);font-size:12px}
.dot{width:12px;height:12px;border-radius:50%}
.bar span.t{flex:1;text-align:center}
#term{flex:1;overflow-y:auto;padding:16px 24px;cursor:text}
.line{white-space:pre-wrap;word-break:break-word}
.p-user{color:var(--green)}.p-host{color:var(--blue)}.dim{color:var(--dim)}.y{color:var(--yellow)}.r{color:var(--red)}.b{color:var(--blue)}.g{color:var(--green)}.pu{color:var(--purple)}
a{color:var(--blue)}a:hover{color:var(--green)}
.cmd{color:var(--yellow);cursor:pointer;text-decoration:underline dotted}
.cmd:hover{color:var(--green)}
.inrow{display:flex;gap:8px}
#in{flex:1;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;caret-color:var(--green);padding:0}
.ascii{color:var(--green);line-height:1.15;font-size:12px}
h3{margin:6px 0 2px;color:var(--yellow);font-size:14px}

@media (max-width:600px){html,body{font-size:12.5px}.ascii{font-size:6.5px}#term{padding:12px 16px}}

<body>
<div class="win" role="application" aria-label="Interactive terminal portfolio">
  <div class="bar"><i class="dot" style="background:#ff5f56"></i><i class="dot" style="background:#ffbd2e"></i><i class="dot" style="background:#27c93f"></i><span class="t">anshuman@portfolio: ~</span></div>
  <div id="term">
    <div id="out" aria-live="polite"></div>
    <div class="inrow"><span id="ps"></span><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command input" autofocus></div>
  </div>
</div>
<noscript><p style="padding:16px">This portfolio is an interactive terminal and needs JavaScript. Contact: <a href="mailto:tanshuman145@gmail.com">tanshuman145@gmail.com</a> · <a href="https://github.com/Ansh101112">GitHub</a> · <a href="https://www.linkedin.com/in/anshumantiiwari/">LinkedIn</a></p></noscript>
<script>
(() => {
const out = document.getElementById('out'), input = document.getElementById('in'), term = document.getElementById('term');
const PS = '<span class="p-user">guest</span><span class="dim">@</span><span class="p-host">anshuman</span><span class="dim">:~$</span>';
document.getElementById('ps').innerHTML = PS;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const link = (u, t) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${esc(t || u)}</a>`;
const c = (cmd, label) => `<span class="cmd" data-cmd="${esc(cmd)}" tabindex="0">${esc(label || cmd)}</span>`;

const LINKS = {
  github: 'https://github.com/Ansh101112',
  linkedin: 'https://www.linkedin.com/in/anshumantiiwari/',
  email: 'mailto:tanshuman145@gmail.com',
  blog: 'https://jackiie.hashnode.dev',
  jabrod: 'https://jabrod.com',
  source: 'https://github.com/Ansh101112/ansh101112.github.io'
};

const PROJECTS = [
  { id:'orchestrator', name:'Workflow LLM Orchestrator', kicker:'turns a goal into steps an LLM can run',
    tags:'TypeScript · AI agents · Tool calling',
    body:['You give a goal. The LLM makes a plan of tool calls.',
          'The plan is checked before it runs, steps run in parallel, and each result is checked.',
          'If a step fails, it fixes only that part and tries again.'],
    links:[['https://ansh101112.github.io/workflow-llm-orchestrator/','demo'],['https://github.com/Ansh101112/workflow-llm-orchestrator','code']] },
  { id:'flashattention', name:'FlashAttention in Triton', kicker:'faster attention on the GPU',
    tags:'Triton · CUDA · PyTorch',
    body:['FlashAttention-2 forward and backward kernels written in Triton.',
          'Memory goes from O(N²) to O(N).',
          'Benchmarked against PyTorch and tested for correct output in fp16 and bf16.'],
    links:[['https://ansh101112.github.io/flashattention-triton/docs/','demo'],['https://github.com/Ansh101112/flashattention-triton','code']] },
  { id:'jabrod', name:'Jabrod', kicker:'my AI workspace for RAG and agents',
    tags:'Next.js · RAG · AI agents',
    body:['Upload documents, search them, and run AI agents on them. 3,000+ users.',
          'Shown at the India AI Impact Summit, Delhi, Feb 2026.'],
    links:[['https://jabrod.com','jabrod.com'],['https://docs.jabrod.com','docs']] },
  { id:'meet', name:'Online Meeting Platform', kicker:'video calls with an AI helper',
    tags:'Next.js · WebRTC · Clerk · OpenAI',
    body:['Video calls with WebRTC, login with Clerk, and an AI helper in the call.'],
    links:[['https://jmeet.vercel.app','live']] },
  { id:'mmmut', name:'College Resources Portal', kicker:'notes, notices and clubs for MMMUT',
    tags:'Full stack · MongoDB',
    body:['A site for MMMUT students to get notes, notices and club updates.'],
    links:[['https://mmmut.xyz','live']] },
  { id:'minirag', name:'mini-rag', kicker:'a small RAG app',
    tags:'TypeScript · RAG',
    body:['A small RAG app you can read in one go.'],
    links:[['https://mini-rag-chi.vercel.app','live'],['https://github.com/Ansh101112/mini-rag','code']] }
];

const BANNER = String.raw`
    _              _                                 _____ _                     _ 
   / \   _ __  ___| |__  _   _ _ __ ___   __ _ _ __ |_   _(_)_      ____ _ _ __(_)
  / _ \ | '_ \/ __| '_ \| | | | '_ ' _ \ / _' | '_ \  | | | \ \ /\ / / _' | '__| |
 / ___ \| | | \__ \ | | | |_| | | | | | | (_| | | | | | | | |\ V  V / (_| | |  | |
/_/   \_\_| |_|___/_| |_|\__,_|_| |_| |_|\__,_|_| |_| |_| |_| \_/\_/ \__,_|_|  |_|`;

const COMMANDS = {
  help: { d:'list available commands', f: () => {
    const rows = Object.entries(COMMANDS).filter(([,v]) => !v.hidden)
      .map(([k,v]) => `  ${c(k)}${' '.repeat(Math.max(1, 14 - k.length))}<span class="dim">${esc(v.d)}</span>`);
    return rows.join('\n') + `\n\n<span class="dim">Tips: Tab autocompletes · ↑/↓ browse history · Ctrl+L clears · click any yellow command.</span>`;
  }},
  about: { d:'who I am', f: () =>
`<span class="g">Anshuman Tiwari</span> — AI Engineer from India.

I build LLM apps, RAG, AI agents and GPU kernels.
Now: <span class="b">AI Engineer Intern at Infinall AI</span>, working on image and video generation.
Studying B.Tech ECE (IoT) at MMMUT Gorakhpur, finishing in 2027.

  <span class="g">80,000+</span>  users on an app I built
  <span class="g">40%</span>      lower LLM cost
  <span class="g">2009</span>     LeetCode rating (Knight)

Next: ${c('experience')} · ${c('projects')} · ${c('contact')}` },
  whoami: { d:'one-line summary', f: () => 'anshuman — AI engineer · LLMs · RAG · AI agents' },
  experience: { d:'work history', f: () =>
`<h3>Infinall AI — Artificial Intelligence Engineer Intern</h3><span class="dim">Sep 2026 — present · Hyderabad, Telangana (Remote)</span>
  • Building image generation and editing for ${link('https://app.infinall.ai','app.infinall.ai')}.
  • Working on video generation.
<h3>Juristo AI Labs — AI Engineer Intern</h3><span class="dim">Dec 2025 — Aug 2026</span>
  • Built a Next.js AI app used by <span class="g">80,000+ users</span>.
  • Built a RAG pipeline for legal answers: parsing, chunking, embeddings, retrieval.
  • Used OpenRouter and multiple agents to send each question to the right tool.
  • Cut LLM cost by <span class="g">40%</span> with prompt caching and smaller models.
<h3>Wecofy Pvt. Ltd. — Full Stack Developer Intern</h3><span class="dim">Jun 2025 — Aug 2025 · Letter of Recommendation</span>
  • Built a MERN shopping and delivery app: products, cart, orders, delivery.
  • Added live order tracking and notifications with Socket.io.` },
  projects: { d:'selected work — try: project 1', f: () =>
    PROJECTS.map((p, i) => `  ${c('project ' + (i + 1), '[' + (i + 1) + ']')} <span class="g">${esc(p.name)}</span> <span class="dim">— ${esc(p.kicker)}</span>`).join('\n') +
    `\n\n<span class="dim">Type</span> ${c('project 1')} <span class="dim">(or</span> project flashattention<span class="dim">) for details.</span>` },
  project: { d:'details for one project', hidden:true, f: (args) => {
    const a = (args[0] || '').toLowerCase();
    if (!a) return `usage: project &lt;number|name&gt;  — see ${c('projects')}`;
    const p = /^\d+$/.test(a) ? PROJECTS[+a - 1] : PROJECTS.find(x => x.id === a || x.name.toLowerCase().includes(a));
    if (!p) return `<span class="r">project not found:</span> ${esc(a)} — see ${c('projects')}`;
    return `<h3>${esc(p.name)}</h3><span class="dim">${esc(p.kicker)}</span>\n${p.body.map(b => '  • ' + esc(b)).join('\n')}\n  <span class="pu">${esc(p.tags)}</span>\n  ${p.links.map(([u,t]) => link(u, '↗ ' + t)).join('   ')}`;
  }},
  skills: { d:'technical skills', f: () => [
    ['Languages','C++, C, Python, JavaScript, TypeScript, SQL'],
    ['AI / ML','LLMs, RAG, AI agents, tool calling, embeddings, vector databases, Triton, CUDA'],
    ['Frameworks','PyTorch, Triton, LangChain, LangGraph, OpenAI APIs, OpenRouter'],
    ['Web & backend','Next.js, React, Node.js, Express, Socket.io, REST APIs'],
    ['Data & cloud','MongoDB, PostgreSQL, Firebase, Supabase, Convex, GCP, AWS'],
    ['Tools','Git, GitHub, Docker, Postman, pytest, GitHub Actions'],
    ['Coursework','DSA, OOP, DBMS, Operating Systems, Computer Networks']
  ].map(([k,v]) => `  <span class="y">${(k + ':').padEnd(17)}</span>${esc(v)}`).join('\n') +
  `\n\n  <span class="y">Competitive:     </span>LeetCode Knight (2009) · Codeforces Specialist (1508) · CodeChef 4★` },
  education: { d:'academics', f: () =>
`<h3>Madan Mohan Malaviya University of Technology, Gorakhpur</h3>  B.Tech, ECE (Internet of Things) · <span class="g">CGPA 8.39</span> · <span class="dim">2023 — 2027</span>
<h3>Udaya Public School</h3>  CBSE Class XII — 90% <span class="dim">(2023)</span> · CBSE Class X — 95.4% <span class="dim">(2021)</span>` },
  achievements: { d:'leadership & awards', f: () =>
`  🏆 Ranked <span class="g">1st</span> in the university's internal Smart India Hackathon 2024 selection.
  🏆 <span class="g">6th</span> of 30,000+ participants in GSSoC 2024 for open-source contributions.
  🎤 Presented ${link('https://jabrod.com','Jabrod')} at the India AI Impact Summit, Delhi — Feb 2026.
  🧠 AI Research Lead at my college tech club.` },
  writing: { d:'blog posts', f: () =>
`  <span class="dim">7 Jun 2026</span>  ${link('https://jackiie.hashnode.dev/scaling-ai-saas-300k-requests','How I Built an AI SaaS That Handled 300,000+ Requests')}
  All posts → ${link(LINKS.blog,'jackiie.hashnode.dev')}` },
  contact: { d:'how to reach me', f: () =>
`  email     ${link(LINKS.email,'tanshuman145@gmail.com')}
  phone     ${link('tel:+919198884058','+91 91988 84058')}
  github    ${link(LINKS.github,'github.com/Ansh101112')}
  linkedin  ${link(LINKS.linkedin,'linkedin.com/in/anshumantiiwari')}

<span class="dim">Open to AI / LLM engineer roles.</span>
<span class="dim">Try</span> ${c('open github')} <span class="dim">or</span> ${c('open email')}` },
  open: { d:'open a link: github | linkedin | email | blog | jabrod | source', f: (args) => {
    const k = (args[0] || '').toLowerCase();
    if (!LINKS[k]) return `usage: open &lt;${Object.keys(LINKS).join('|')}&gt;`;
    window.open(LINKS[k], k === 'email' ? '_self' : '_blank', 'noopener');
    return `opening ${link(LINKS[k], k)} …`;
  }},
  banner: { d:'show the welcome banner', f: () => welcome() },
  history: { d:'commands you have run', f: () => hist.length ? hist.map((h, i) => `  ${String(i + 1).padStart(3)}  ${esc(h)}`).join('\n') : '<span class="dim">no history yet</span>' },
  clear: { d:'clear the screen', f: () => { out.innerHTML = ''; return null; } },
  ls: { hidden:true, f: () => Object.keys(COMMANDS).filter(k => !COMMANDS[k].hidden).map(k => c(k)).join('  ') },
  sudo: { hidden:true, f: () => '<span class="r">Permission denied:</span> nice try. Hire me instead → ' + c('contact') },
  date: { hidden:true, f: () => esc(new Date().toString()) },
  echo: { hidden:true, f: (args) => esc(args.join(' ')) },
  pwd: { hidden:true, f: () => '/home/anshuman' },
  exit: { hidden:true, f: () => 'There is no escape. Type ' + c('help') + '.' }
};
const ALIASES = { cls:'clear', '?':'help', man:'help', exp:'experience', work:'experience', edu:'education', blog:'writing', awards:'achievements', resume:'experience', cv:'experience', dir:'ls' };

function welcome() {
  return `<div class="ascii">${esc(BANNER)}</div>
<span class="g">AI Engineer</span> · LLMs · RAG · AI agents · GPU kernels

Type ${c('help')} to see all commands, or start with ${c('about')}.`;
}

function print(html, cls) {
  const d = document.createElement('div');
  d.className = 'line' + (cls ? ' ' + cls : '');
  d.innerHTML = html;
  out.appendChild(d);
}

const hist = []; let hIdx = 0;
function run(raw) {
  const line = raw.trim();
  print(`${PS} ${esc(raw)}`);
  if (line) { hist.push(line); }
  hIdx = hist.length;
  if (!line) return scroll();
  const [name0, ...args] = line.split(/\s+/);
  const name = ALIASES[name0.toLowerCase()] || name0.toLowerCase();
  const cmd = COMMANDS[name];
  const res = cmd ? cmd.f(args) : `<span class="r">command not found:</span> ${esc(name0)}. Type ${c('help')} for the list.`;
  if (res !== null && res !== undefined) print(res);
  print('');
  scroll();
}
const scroll = () => { term.scrollTop = term.scrollHeight; };

function complete() {
  const v = input.value; const parts = v.split(/\s+/);
  let pool, prefix;
  if (parts.length === 1) { pool = Object.keys(COMMANDS).concat(Object.keys(ALIASES)); prefix = parts[0]; }
  else if (parts[0] === 'open') { pool = Object.keys(LINKS); prefix = parts[1]; }
  else if (parts[0] === 'project') { pool = PROJECTS.map(p => p.id); prefix = parts[1]; }
  else return;
  const m = [...new Set(pool)].filter(x => x.startsWith(prefix.toLowerCase()));
  if (m.length === 1) { parts[parts.length - 1] = m[0]; input.value = parts.join(' ') + (parts.length === 1 && ['open','project'].includes(m[0]) ? ' ' : ''); }
  else if (m.length > 1) { print(`${PS} ${esc(v)}`); print(m.map(x => esc(x)).join('  ')); scroll(); }
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const v = input.value; input.value = ''; run(v); }
  else if (e.key === 'ArrowUp') { if (hIdx > 0) { input.value = hist[--hIdx]; } e.preventDefault(); }
  else if (e.key === 'ArrowDown') { if (hIdx < hist.length - 1) input.value = hist[++hIdx]; else { hIdx = hist.length; input.value = ''; } e.preventDefault(); }
  else if (e.key === 'Tab') { e.preventDefault(); complete(); }
  else if (e.key.toLowerCase() === 'l' && e.ctrlKey) { e.preventDefault(); out.innerHTML = ''; }
});
out.addEventListener('click', e => { const t = e.target.closest('.cmd'); if (t) { run(t.dataset.cmd); input.focus(); } });
out.addEventListener('keydown', e => { const t = e.target.closest('.cmd'); if (t && e.key === 'Enter') { run(t.dataset.cmd); input.focus(); } });
term.addEventListener('click', e => { if (!e.target.closest('a,.cmd') && !window.getSelection().toString()) input.focus(); });

print(welcome()); print('');
})();
</script>
</body>
</html>
